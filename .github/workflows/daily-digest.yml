name: Daily Agents Radar

on:
  schedule:
    # 08:17 CST, with 12:17 and 16:17 catch-up attempts away from hourly peaks.
    - cron: "17 0,4,8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether today was published
        id: published
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ "$EVENT_NAME" = "schedule" ] && [ -f "digests/$DATE/.published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's digest is already published; skipping catch-up."
          fi

      - name: Setup pnpm
        if: steps.published.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        if: steps.published.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: http://107.174.65.61:8318/v1
          OPENAI_MODEL: gpt-5.5
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          # A Vercel OIDC-backed proxy for skills.sh. See README.zh.md.
          SKILLS_PROXY_URL: ${{ secrets.SKILLS_PROXY_URL }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        if: steps.published.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            HUSKY=0 git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: steps.published.outputs.skip != 'true'
        run: pnpm manifest

      - name: Commit manifest and feed
        if: steps.published.outputs.skip != 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Mark today's digest as published
        if: steps.published.outputs.skip != 'true'
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          touch "digests/$DATE/.published"
          git add "digests/$DATE/.published"
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "Record successful daily publication" -m "Confidence: high" -m "Scope-risk: narrow"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: steps.published.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://leisure3318.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.published.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://leisure3318.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        if: steps.published.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
