name: Check digest gateway models
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List available model identifiers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os,json,urllib.request
          req=urllib.request.Request('http://107.174.65.61:8318/v1/models',headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY']})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          for item in data.get('data',[]):
              print(item['id'])
          PYCODE
